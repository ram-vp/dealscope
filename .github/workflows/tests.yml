name: Tests

# Scoring, refresh guards, and live-pointer checks. No data is published.
on:
  # Filtered here, not with a job-level `if`: the bot merges and deletes its
  # branch within seconds, and a run created for it died at startup (a red
  # "workflow file issue" on every daily refresh).
  pull_request:
    paths-ignore:
      - 'data/frontend/**'
      - 'data/enriched/**'
  push:
    branches: [main, pro-upgrade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'price-refresh/') && !startsWith(github.head_ref, 'price-sync/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pandas==2.2.2 requests==2.34.2

      - name: Lint workflows and shell scripts
        run: |
          pip install actionlint-py shellcheck-py
          actionlint .github/workflows/*.yml
          shellcheck .github/scripts/*.sh

      - name: Tests
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "########## $f ##########"
            python3 "$f"
          done
